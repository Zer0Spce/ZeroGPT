name: Build ZeroGPT Portable

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zerogpt-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build portable app
        shell: pwsh
        run: |
          if (Test-Path build) { Remove-Item build -Recurse -Force }
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          if (Test-Path release) { Remove-Item release -Recurse -Force }

          pyinstaller --noconfirm --clean --windowed --onedir `
            --name ZeroGPT `
            --collect-all markdown `
            --collect-all PySide6 `
            app.py

          New-Item -ItemType Directory -Force -Path release\ZeroGPT-Portable | Out-Null
          Copy-Item -Path dist\ZeroGPT\* -Destination release\ZeroGPT-Portable -Recurse -Force

          @'
          ZeroGPT Portable
          ================

          1. Run ZeroGPT.exe.
          2. Open Settings and use Install / Repair Local AI if the AI runtimes are not ready yet.
          3. ZeroGPT portable data is stored in ZeroGPT_Data beside the EXE.
          4. Keep the full folder together when moving it to another PC or drive.
          '@ | Set-Content -Path release\ZeroGPT-Portable\README-PORTABLE.txt -Encoding UTF8

          Compress-Archive -Path release\ZeroGPT-Portable -DestinationPath release\ZeroGPT-Portable.zip -CompressionLevel Optimal -Force

      - name: Upload unpacked portable folder
        uses: actions/upload-artifact@v4
        with:
          name: ZeroGPT-Portable-Unpacked
          path: release/ZeroGPT-Portable/
          if-no-files-found: error
          retention-days: 30

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ZeroGPT-Portable-ZIP
          path: release/ZeroGPT-Portable.zip
          if-no-files-found: error
          retention-days: 30
